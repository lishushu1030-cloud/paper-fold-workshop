<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>折纸工坊</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#efe9dc;
    font-family:"LXGW WenKai","Kaiti SC","STKaiti","KaiTi",serif;color:#4a4038;
    background-image:radial-gradient(#e3dac8 1px,transparent 1px);background-size:22px 22px;
    display:flex;justify-content:center;padding:40px 16px 60px}
  .card{width:min(680px,100%);background:#fbf7ee;border:1px solid #ddd2bd;border-radius:18px;
    box-shadow:0 10px 30px rgba(90,70,40,.12);padding:34px 38px 30px}
  h1{margin:0 0 6px;font-size:30px;letter-spacing:2px}
  .sub{color:#8a7d6c;font-size:14px;margin-bottom:26px}
  .step{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
  .num{width:26px;height:26px;border-radius:50%;background:#c86a2a;color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:14px;align-self:center}
  .step b{font-size:17px}
  .drop{border:2px dashed #c9bda2;border-radius:14px;background:#f5efe1;padding:26px 16px;
    text-align:center;cursor:pointer;transition:.2s}
  .drop:hover,.drop.over{border-color:#c86a2a;background:#f8f2e4}
  .drop .hint{color:#8a7d6c;font-size:14px}
  #preview{max-width:180px;max-height:180px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.15);
    display:none;margin:0 auto}
  #fname{font-size:13px;color:#8a7d6c;margin-top:8px;display:none}
  #text{width:100%;border:1px solid #d8cdb6;border-radius:10px;background:#fff;
    padding:12px 14px;font-size:18px;font-family:inherit;color:#4a4038;outline:none}
  #text:focus{border-color:#c86a2a}
  .opts{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
  .opt label{font-size:13px;color:#8a7d6c;display:block;margin-bottom:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:6px 16px;border-radius:999px;border:1.5px solid #d8cdb6;background:#fff;
    cursor:pointer;font-size:14px;font-family:inherit;color:#6b5f50}
  .chip.on{background:#c86a2a;border-color:#c86a2a;color:#fff}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.on{outline:2.5px solid #c86a2a;outline-offset:2px}
  #go{margin-top:30px;width:100%;padding:14px;border:0;border-radius:12px;background:#c86a2a;
    color:#fff;font-size:19px;font-family:inherit;letter-spacing:6px;cursor:pointer}
  #go:disabled{background:#d8cdb6;cursor:wait}
  #go:not(:disabled):active{transform:scale(.98)}
  #msg{margin-top:14px;font-size:14px;text-align:center;min-height:20px;color:#8a7d6c;line-height:1.6}
  #msg.err{color:#b04030}
  a.res{color:#c86a2a;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <h1>折纸工坊</h1>
  <div class="sub">上传一张照片，写一句话 —— 自动抠图、折纸、展开成一张小纸条<br>
  <span style="font-size:12px">全程在你的浏览器里完成，照片不会上传到任何服务器</span></div>

  <div class="step"><span class="num">1</span><b>选一张封面照片</b></div>
  <div class="drop" id="drop">
    <img id="preview" alt="">
    <div class="hint" id="hint">点击选择 或 把照片拖到这里<br><span style="font-size:12px">人物 / 猫咪 / 玩偶 / 花束 都可以</span></div>
    <div id="fname"></div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <div class="step"><span class="num">2</span><b>写一句话</b></div>
  <input id="text" placeholder="例如：爸爸妈妈，我出生了" maxlength="30">

  <div class="opts">
    <div class="opt">
      <label>字体</label>
      <div class="chips" id="fonts">
        <button class="chip on" data-v="kai">楷体</button>
        <button class="chip" data-v="song">宋体</button>
        <button class="chip" data-v="hei">黑体</button>
      </div>
    </div>
    <div class="opt">
      <label>文字颜色</label>
      <div class="chips" id="colors"></div>
    </div>
  </div>

  <button id="go">折 纸 展 开</button>
  <div id="msg"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const COLORS=['#3a2f26','#8c4a3c','#3d5a4c','#31465e','#6b5a86','#b0653a'];
const FONTS={
  kai :'"LXGW WenKai","Kaiti SC","STKaiti","KaiTi",serif',
  song:'"Songti SC","STSong","SimSun",serif',
  hei :'"PingFang SC","Microsoft YaHei","Heiti SC",sans-serif'
};
const NOSEG = new URLSearchParams(location.search).has('noseg'); // 本地调试：跳过 AI 抠图

let imgBlob=null,imgName='';
let font='kai', color=COLORS[0];
let modelLoading=false;

/* 颜色块 */
const cwrap=$('colors');
COLORS.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='sw'+(i===0?' on':''); b.style.background=c; b.title=c;
  b.onclick=()=>{color=c;[...cwrap.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');};
  cwrap.appendChild(b);
});
/* 字体选择 */
$('fonts').onclick=e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  font=b.dataset.v;
  [...$('fonts').children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
};

/* 选图 */
const drop=$('drop'), fileIn=$('file');
drop.onclick=()=>fileIn.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');
  if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);};
fileIn.onchange=()=>{if(fileIn.files[0])loadFile(fileIn.files[0]);};
function loadFile(f){
  if(!f.type.startsWith('image/')){note('请选择图片文件',1);return;}
  imgBlob=f;imgName=f.name;
  $('preview').src=URL.createObjectURL(f);$('preview').style.display='block';
  $('hint').style.display='none';
  $('fname').textContent=f.name;$('fname').style.display='block';
}

function note(t,err){const m=$('msg');m.innerHTML=t;m.className=err?'err':'';}

/* ───────── AI 抠图模型（浏览器端推理，RMBG-1.4） ───────── */
const TF_ESM=[
  'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5/+esm',
  'https://fastly.jsdelivr.net/npm/@huggingface/transformers@3.7.5/+esm',
  'https://esm.sh/@huggingface/transformers@3.7.5'
];
const MODEL_HOSTS=['https://hf-mirror.com','https://huggingface.co'];
let tf=null;

async function ensureModel(){
  if(tf||NOSEG)return;
  if(modelLoading)throw new Error('抠图模型正在加载中，请等几秒再点一次');
  modelLoading=true;
  try{
    let mod=null,lastErr=null;
    for(const u of TF_ESM){
      try{ mod=await import(u); break; }catch(e){ lastErr=e; }
    }
    if(!mod)throw new Error('AI 引擎加载失败，请检查网络后重试 '+(lastErr&&lastErr.message||''));
    mod.env.allowLocalModels=false;
    let model=null,processor=null,lastHostErr=null;
    for(const host of MODEL_HOSTS){
      try{
        mod.env.remoteHost=host;
        model=await mod.AutoModel.from_pretrained('briaai/RMBG-1.4',{config:{model_type:'custom'}});
        processor=await mod.AutoProcessor.from_pretrained('briaai/RMBG-1.4',{
          config:{
            do_normalize:true, do_pad:false, do_rescale:true, do_resize:true,
            image_mean:[0.5,0.5,0.5], feature_extractor_type:'ImageFeatureExtractor',
            image_std:[1,1,1], resample:2, rescale_factor:0.00392156862745098,
            size:{width:1024,height:1024}
          }});
        break;
      }catch(e){ lastHostErr=e; model=null; processor=null; }
    }
    if(!model)throw new Error('抠图模型下载失败，请检查网络后重试 '+(lastHostErr&&lastHostErr.message||''));
    tf={mod,model,processor};
  }finally{ modelLoading=false; }
}

function blobToDataUrl(b){return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b);});}

/* ───────── 生成 ───────── */
$('go').onclick=async()=>{
  if(!imgBlob)return note('先选一张照片哦',1);
  const text=$('text').value.trim();
  if(!text)return note('写一句话吧',1);
  const go=$('go');go.disabled=true;
  try{
    if(!NOSEG){
      await ensureModel();
      note('正在 AI 抠图…<br><span style="font-size:12px">首次使用需下载模型（几十 MB），之后会快很多</span>');
    }
    const cutBmp=await segment(imgBlob);
    note('正在折纸、排版…');
    const url=await buildResult(cutBmp,text);
    window.__lastResult=url;
    note('折好了！<a class="res" href="'+url+'" target="_blank">点这里查看成品</a>（已自动打开新窗口）');
    window.open(url,'_blank');
  }catch(e){ note((e&&e.message)||'生成失败',1); }
  go.disabled=false;
};

async function segment(blob){
  if(NOSEG)return createImageBitmap(blob);          // 调试：整图当主体
  await ensureModel();
  // 压到最大边 1600 再送模型，省内存提速
  const src=await createImageBitmap(blob);
  const k=Math.min(1,1600/Math.max(src.width,src.height));
  let drawW=src.width,drawH=src.height,drawSrc=src;
  if(k<1){
    drawW=Math.round(src.width*k);drawH=Math.round(src.height*k);
    const c=document.createElement('canvas');
    c.width=drawW;c.height=drawH;
    c.getContext('2d').drawImage(src,0,0,drawW,drawH);
    drawSrc=c;
  }
  const c2=document.createElement('canvas');c2.width=drawW;c2.height=drawH;
  c2.getContext('2d').drawImage(drawSrc,0,0,drawW,drawH);
  const image=await tf.mod.RawImage.fromURL(c2.toDataURL('image/png'));
  const {pixel_values}=await tf.processor(image);
  const {output}=await tf.model({input:pixel_values});
  const mask=await tf.mod.RawImage.fromTensor(output[0].mul(255).to('uint8'))
    .resize(drawW,drawH);
  // 把 mask 写进 alpha 通道
  const out=document.createElement('canvas');out.width=drawW;out.height=drawH;
  const octx=out.getContext('2d');
  octx.drawImage(drawSrc,0,0,drawW,drawH);
  const od=octx.getImageData(0,0,drawW,drawH);
  for(let i=0;i<drawW*drawH;i++)od.data[i*4+3]=mask.data[i];
  octx.putImageData(od,0,0);
  return out;
}

/* ───────── 封面贴纸合成（移植 make_cover.py） ───────── */
function maxFilter(src,w,h,r){
  const tmp=new Uint8Array(w*h),out=new Uint8Array(w*h);
  for(let y=0;y<h;y++){const row=y*w;
    for(let x=0;x<w;x++){let m=0;const a=Math.max(0,x-r),b=Math.min(w-1,x+r);
      for(let xx=a;xx<=b;xx++){const v=src[row+xx];if(v>m)m=v;}tmp[row+x]=m;}}
  for(let x=0;x<w;x++)
    for(let y=0;y<h;y++){let m=0;const a=Math.max(0,y-r),b=Math.min(h-1,y+r);
      for(let yy=a;yy<=b;yy++){const v=tmp[yy*w+x];if(v>m)m=v;}out[y*w+x]=m;}
  return out;
}
function convexHull(pts){
  pts=[...new Set(pts.map(p=>p[0]+','+p[1]))].map(s=>s.split(',').map(Number))
      .sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(pts.length<=2)return pts;
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lower=[];for(const p of pts){while(lower.length>=2&&cross(lower[lower.length-2],lower[lower.length-1],p)<=0)lower.pop();lower.push(p);}
  const upper=[];for(let i=pts.length-1;i>=0;i--){const p=pts[i];
    while(upper.length>=2&&cross(upper[upper.length-2],upper[upper.length-1],p)<=0)upper.pop();upper.push(p);}
  return lower.slice(0,-1).concat(upper.slice(0,-1));
}
function bboxOf(A,w,h){
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)
    if(A[y*w+x]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  return x1<0?null:[x0,y0,x1,y1];
}
function closeBottom(A,w,h,bb){
  const [x0,y0,x1,y1]=bb;
  if(y1<h-3)return A;
  const sw=x1-x0,sh=y1-y0;
  const rx=sw*0.95, ry=Math.max(sh*0.72,120);
  const cx=(x0+x1)/2, cy=y1+20-ry;
  for(const corner of [x0,x1]){
    const dx=(corner-cx)/rx, dy=(y0-cy)/ry;
    if(dx*dx+dy*dy>0.98)return A;   // 安全校验：宁可不收口也不切头
  }
  const out=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=(x-cx)/rx, dy=(y-cy)/ry;
    if(dx*dx+dy*dy<=1&&A[y*w+x]>8)out[y*w+x]=A[y*w+x];
  }
  return out;
}
function composeSticker(bmp){
  const SQ=1024,FILL=0.88;
  const w=bmp.width,h=bmp.height;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.drawImage(bmp,0,0);
  const px=ctx.getImageData(0,0,w,h).data;
  let A=new Uint8Array(w*h);
  for(let i=0,j=3;i<A.length;i++,j+=4){const v=px[j];A[i]=v<40?0:v;}
  let bb=bboxOf(A,w,h);
  if(!bb)throw new Error('没有识别到前景主体，换一张清晰点的照片试试');
  A=closeBottom(A,w,h,bb);
  bb=bboxOf(A,w,h);
  const cw=bb[2]-bb[0]+1,ch=bb[3]-bb[1]+1;
  const k=FILL*SQ/Math.max(cw,ch);
  const nw=Math.max(1,Math.round(cw*k)),nh=Math.max(1,Math.round(ch*k));
  const cut=document.createElement('canvas');cut.width=cw;cut.height=ch;
  const cd=cctx2img(cut,cw,ch,px,A,w,bb[0],bb[1]);
  const out=document.createElement('canvas');out.width=SQ;out.height=SQ;
  const octx=out.getContext('2d');
  const ox=(SQ-nw)>>1,oy=(SQ-nh)>>1;
  octx.imageSmoothingEnabled=true;octx.imageSmoothingQuality='high';
  octx.drawImage(cut,ox,oy,nw,nh);
  const od=octx.getImageData(0,0,SQ,SQ);
  const a=new Uint8Array(SQ*SQ);
  for(let i=0,j=3;i<a.length;i++,j+=4)a[i]=od.data[j];
  const border=maxFilter(maxFilter(a,SQ,SQ,10),SQ,SQ,4);
  for(let i=0,j=0;i<a.length;i++,j+=4){
    if(a[i]===0&&border[i]>0){
      od.data[j]=252;od.data[j+1]=250;od.data[j+2]=246;od.data[j+3]=border[i];
    }
  }
  octx.putImageData(od,0,0);
  const pts=[];
  for(let y=0;y<SQ;y+=6){let mn=-1,mx=-1;
    for(let x=0;x<SQ;x+=4)if(border[y*SQ+x]>128){if(mn<0)mn=x;mx=x;}
    if(mn>=0){pts.push([mn,y],[mx,y]);}}
  for(let x=0;x<SQ;x+=6){let mn=-1,mx=-1;
    for(let y=0;y<SQ;y+=4)if(border[y*SQ+x]>128){if(mn<0)mn=y;mx=y;}
    if(mn>=0){pts.push([x,mn],[x,mx]);}}
  const hull=convexHull(pts).map(([u,v])=>[+(u/SQ).toFixed(4),+(v/SQ).toFixed(4)]);
  return {stickerCanvas:out,hull};
}
function cctx2img(cut,cw,ch,px,A,w,ox,oy){
  const cctx=cut.getContext('2d');
  const img=cctx.createImageData(cw,ch);
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){
    const si=(y+oy)*w+(x+ox),di=(y*cw+x)*4;
    img.data[di]=px[si*4];img.data[di+1]=px[si*4+1];
    img.data[di+2]=px[si*4+2];img.data[di+3]=A[si];
  }
  cctx.putImageData(img,0,0);
  return img;
}
function coverPlacement(tpl){
  const m=tpl.match(/"100": \[(.*?)\]/);
  if(!m)throw new Error('模板缺少关键帧数据');
  const vals=m[1].split(',').map(Number);
  const xs=vals.filter((_,i)=>i%3===0),zs=vals.filter((_,i)=>i%3===2);
  const cx=(Math.min(...xs)+Math.max(...xs))/2;
  const cz=(Math.min(...zs)+Math.max(...zs))/2;
  const S=1.45*Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...zs)-Math.min(...zs));
  return {minX:+(cx-S/2).toFixed(5),minZ:+(cz-S/2).toFixed(5),S:+S.toFixed(5)};
}
function blobToB64(b){return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res(r.result.split(',')[1]);
  r.onerror=rej;r.readAsDataURL(b);});}

/* ───────── 组装成品 HTML ───────── */
async function buildResult(cutBmp,text){
  const {stickerCanvas,hull}=composeSticker(cutBmp);
  const stickerBlob=await new Promise(r=>stickerCanvas.toBlob(r,'image/png'));
  const [coverB64,paperB64,tplText]=await Promise.all([
    blobToB64(stickerBlob),
    blobToB64(await (await fetch('./paper_texture.jpg'+location.search)).blob()),
    (await fetch('./paper-fold-template.html'+location.search)).text()
  ]);
  const place=coverPlacement(tplText);
  const textJson={content:text,font:FONTS[font],color:color,size:150};
  let html=tplText
    .replace('__COVER_IMG_B64__',coverB64)
    .replace('__COVER_JSON__',JSON.stringify({minX:place.minX,minZ:place.minZ,S:place.S,hull:hull}))
    .replace('__TEXT_JSON__',JSON.stringify(textJson))
    .replace('__PAPER_IMG_B64__',paperB64);
  for(const ph of ['__COVER_IMG_B64__','__COVER_JSON__','__TEXT_JSON__','__PAPER_IMG_B64__'])
    if(html.includes(ph))throw new Error('成品组装不完整，请重试');
  return URL.createObjectURL(new Blob([html],{type:'text/html'}));
}
</script>
</body>
</html>
